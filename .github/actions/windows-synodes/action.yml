name: Set up the Windows synodes
description: >
  Steps 1-5 of the Windows closed test: downloads the synode Windows zip, extracts it for hub, prv1,
  prv2, starts the central (.github/actions/start-central), configures each node with setup-cli.exe
  (answers/windows/<node>.txt, through a pseudo console), which installs the Windows services, waits
  for the jservs, then reports and checks the central's domain tables.

  Expects the job env of synodes-windows-closed-test.yml: CENTRAL_URL, CENTRAL_ORG, CENTRAL_DOMAIN,
  HUB_ID, CENTRAL_PSWD, SYNC_INS, GH_TOKEN; and Python, Java 17 set up before it. Sets WS, CONFIG,
  WORK (D:/a/... paths) and PACKAGE in the job env.

inputs:
  token:
    description: Token that can read the central release (secret REGIST_CENTRAL_0_1_8_SNAPSHOT_TOKEN)
    required: true
  central-repo:
    description: Repository of the central release
    default: Acadynamo/Resources-release
  central-release:
    description: Release tag of the central
    default: alpha-central-0.1.8
  release-tag:
    description: Release of the synode package, empty for the newest synode windows zip in any release
    default: ''

outputs:
  central-db:
    description: The central's system.sqlite
    value: ${{ steps.central.outputs.db }}
  central-home:
    description: The central's working directory
    value: ${{ steps.central.outputs.home }}

runs:
  using: composite
  steps:
    - name: Elevation, paths, tools
      shell: bash
      run: |
        # setup-cli.exe installs Windows services: GitHub's Windows runners run elevated (UAC off)
        powershell -NoProfile -Command 'if (-not ([Security.Principal.WindowsPrincipal][Security.Principal.WindowsIdentity]::GetCurrent()).IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)) { exit 1 }' || {
          echo "::error::the job is not elevated: setup-cli.exe can't install the Windows services"; exit 1; }
        ws=$(cygpath -m "$GITHUB_WORKSPACE")
        { echo "WS=$ws"; echo "CONFIG=$ws/.github/closed-test"; echo "WORK=$ws/e2e"; } >> $GITHUB_ENV
        mkdir -p "$ws/e2e/dl" "$ws/e2e/logs"
        pip install -q pywinpty      # feed_answers.py --console: setup-cli.exe reads the console, not stdin

    - name: Check the answer files
      shell: bash
      run: |
        for f in $CONFIG/answers/windows/{hub,prv1,prv2}.txt; do
          python $CONFIG/feed_answers.py $f --dry-run
        done

    # ---- 1. the package ----
    - name: Download the synode package
      shell: bash
      env:
        RELEASE_TAG: ${{ inputs.release-tag }}
      run: |
        gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases" > $WORK/dl/releases.json
        pick=$(python $CONFIG/closed_test.py pick-release $WORK/dl/releases.json '^synode-.*x64_windows.*\.zip$' "$RELEASE_TAG" | tr -d '\r')
        [ -n "$pick" ] || { echo "::error::no synode windows zip found in releases ${RELEASE_TAG:+(tag $RELEASE_TAG)}"; exit 1; }
        IFS=$'\t' read -r updated tag name <<< "$pick"
        gh release download "$tag" -R "$GITHUB_REPOSITORY" -p "$name" -D $WORK/dl
        echo "PACKAGE=$WORK/dl/$name" >> $GITHUB_ENV
        echo "### Package: \`$name\` (release \`$tag\`, uploaded $updated)" >> $GITHUB_STEP_SUMMARY

    # ---- 2. three nodes ----
    - name: Extract hub, prv1, prv2
      shell: bash
      run: |
        for n in hub prv1 prv2; do
          7z x -y -bd "$PACKAGE" -o"$WORK/$n" > /dev/null || { echo "::error::cannot extract $PACKAGE"; exit 1; }
        done
        ls $WORK/hub
        [ -f $WORK/hub/setup-cli.exe ] || { echo "::error::no setup-cli.exe in the package"; exit 1; }

    # ---- 3. central ----
    - name: Start the registry central
      id: central
      uses: ./.github/actions/start-central
      with:
        token: ${{ inputs.token }}
        repo: ${{ inputs.central-repo }}
        release: ${{ inputs.central-release }}
        path: ${{ env.WORK }}/central          # D:/a/..., set by the first step

    - name: Check the central before the run
      shell: bash
      env:
        DB: ${{ steps.central.outputs.db }}
      run: |
        [ -n "$DB" ] || { echo "::error::no central system.sqlite in the release"; exit 1; }
        python $CONFIG/closed_test.py before "$DB" $CENTRAL_ORG $CENTRAL_DOMAIN $WORK/others-before.txt

    # ---- 4. nodes, one by one: configure, install the services, wait for the jserv ----
    - name: Configure the synodes, install their services
      shell: bash
      run: |
        . $CONFIG/windows_nodes.sh
        setup_node hub  8961 $HUB_ID
        setup_node prv1 8962 $CENTRAL_DOMAIN-1
        setup_node prv2 8963 $CENTRAL_DOMAIN-2

    # ---- 5. report ----
    - name: Report the central's domain tables
      if: always()
      shell: bash
      env:
        DB: ${{ steps.central.outputs.db }}
      run: |
        [ -n "$DB" ] && [ -f $WORK/others-before.txt ] || { echo "no central db or no before-state"; exit 0; }
        python $CONFIG/closed_test.py report "$DB" $CENTRAL_ORG $CENTRAL_DOMAIN $HUB_ID $WORK/others-before.txt \
               --summary $WORK/logs/central-tables.md
