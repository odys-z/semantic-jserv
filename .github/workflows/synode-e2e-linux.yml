# Linux end-to-end setup test of the synode package, started by hand from the Actions tab.
#
# 1. Downloads the newest synode-*-x64_linux*.tar.gz from this repo's releases (or the tag given).
# 2. Extracts it for 3 nodes: hub, prv1, prv2.
# 3. Downloads the registry central (jar, WEB-INF, regist-vol) from the release CENTRAL_RELEASE
#    of CENTRAL_REPO (private: read with the secret REGIST_CENTRAL_0_1_8_SNAPSHOT_TOKEN),
#    and starts it as a systemd unit.
# 4. Configures each node with synode-cli, fed by jserv-album/actions-config/answers/<node>.txt, and starts its jserv.
# 5. Reports the central's domain tables in the run's Summary.
#
# See jserv-album/actions-config/README.md for the central release to upload.

name: synode-e2e-linux

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to test (empty: the newest synode linux tar.gz in any release)'
        required: false
        default: ''
      central_repo:
        description: 'Repository of the central release'
        required: false
        default: 'Acadynamo/Resources-release'
      central_release:
        description: 'Release tag of the central (jar, WEB-INF, regist-vol)'
        required: false
        default: 'alpha-central-0.1.8'

permissions:
  contents: read

jobs:
  domain-setup:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      CENTRAL_REPO: ${{ inputs.central_repo }}
      CENTRAL_RELEASE: ${{ inputs.central_release }}
      CONFIG: ${{ github.workspace }}/jserv-album/actions-config
      WORK: ${{ github.workspace }}/e2e
      CENTRAL_URL: http://127.0.0.1:1991/regist-central
      CENTRAL_ORG: closed-test          # the org of the package; only its rows are reported
      CENTRAL_DOMAIN: closed-1          # the domain the answer files select
      CENTRAL_PSWD: '123456'            # admin of the test central (alpha-central-0.1.8), test only
      SYNC_INS: '20'

    steps:
      - uses: actions/checkout@v4          # only the test resources; the package needs no sources
        with:
          sparse-checkout: jserv-album/actions-config

      - uses: actions/setup-java@v4          # for the central; the synodes download their own jre17
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: OS packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libimage-exiftool-perl sqlite3
          mkdir -p $WORK/dl $WORK/logs

      - name: Check the answer files
        run: |
          for f in $CONFIG/answers/{hub,prv1,prv2}.txt; do
            python $CONFIG/feed_answers.py $f --dry-run
          done

      # ---- 1. newest package ----
      - name: Download the synode package
        run: |
          # every release, newest asset first; filtered by RELEASE_TAG when given
          pick=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" | jq -rs --arg t "$RELEASE_TAG" '
                   add | map(select($t == "" or .tag_name == $t) | .tag_name as $tag
                   | .assets[] | select(.name | test("^synode-.*x64_linux.*\\.tar\\.gz$"))
                   | [.updated_at, $tag, .name]) | sort | reverse | .[0] // empty | @tsv')
          [ -n "$pick" ] || { echo "::error::no synode linux tar.gz found in releases ${RELEASE_TAG:+(tag $RELEASE_TAG)}"; exit 1; }
          IFS=$'\t' read -r updated tag name <<< "$pick"
          gh release download "$tag" -R "$GITHUB_REPOSITORY" -p "$name" -D $WORK/dl
          echo "PACKAGE=$WORK/dl/$name" >> $GITHUB_ENV
          echo "### Package: \`$name\` (release \`$tag\`, uploaded $updated)" >> $GITHUB_STEP_SUMMARY

      # ---- 2. three nodes ----
      - name: Extract hub, prv1, prv2
        run: |
          for n in hub prv1 prv2; do
            mkdir -p $WORK/$n && tar -xf "$PACKAGE" -C $WORK/$n    # the tar.gz has no top folder
          done
          pip install -q $WORK/hub/bin/synode_py3-*.whl
          synode-cli --help | head -1

      # ---- 3. central ----
      - name: Download the central
        env:
          # the default GH_TOKEN can read only this repository's releases
          GH_TOKEN: ${{ secrets.REGIST_CENTRAL_0_1_8_SNAPSHOT_TOKEN }}
        run: |
          [ -n "$GH_TOKEN" ] || { echo "::error::secret REGIST_CENTRAL_0_1_8_SNAPSHOT_TOKEN is not set"; exit 1; }
          # all assets of the release: archives are unpacked, a loose jar is copied
          gh release download "$CENTRAL_RELEASE" -R "$CENTRAL_REPO" -D $WORK/dl/central || {
            echo "::error::cannot download release '$CENTRAL_RELEASE' of $CENTRAL_REPO (token scope?)"; exit 1; }
          ls -l $WORK/dl/central
          mkdir -p $WORK/central
          for a in $WORK/dl/central/*; do
            case "$a" in
              *.zip)           unzip -q "$a" -d $WORK/central ;;
              *.tar.gz|*.tgz)  tar -xf "$a" -C $WORK/central ;;
              *.jar)           cp "$a" $WORK/central/ ;;
            esac
          done
          echo "### Central: release \`$CENTRAL_RELEASE\` of \`$CENTRAL_REPO\`" >> $GITHUB_STEP_SUMMARY
          (cd $WORK/dl/central && ls -1) | sed 's/^/- /' >> $GITHUB_STEP_SUMMARY

      - name: Start registry central (systemd, port 1991)
        run: |
          # runs in the folder holding WEB-INF/ (the jar may be elsewhere in the release)
          jar=$(find $WORK/central -maxdepth 3 -name '*.jar' | head -1)
          [ -n "$jar" ] || { echo "::error::no .jar in the central release"; exit 1; }
          cfg=$(find $WORK/central -maxdepth 3 -path '*/WEB-INF/settings.json' | head -1)
          [ -n "$cfg" ] || { echo "::error::no WEB-INF/settings.json in the central release"; exit 1; }
          home=$(dirname "$(dirname "$cfg")")
          echo "central: $jar, working directory $home"
          find $WORK/central -name system.sqlite | grep -q . || \
            echo "::warning::no system.sqlite in the release: the central initializes a new volume from WEB-INF/*.sql"

          sudo systemd-run --unit=regist-central --working-directory=$home \
               --uid=$(id -u) --gid=$(id -g) $JAVA_HOME/bin/java -jar "$jar" settings.json   # WEB-INF/settings.json
          timeout 90 bash -c 'until nc -z 127.0.0.1 1991; do sleep 2; done' || {
            sudo journalctl -u regist-central --no-pager | tail -80; exit 1; }

      # ---- 4. nodes, one by one: configure, then start the jserv ----
      - name: Configure and start the synodes
        shell: bash
        run: |
          setup_node() {   # <node> <jserv-port>
            # the test central's admin password, not the package's default (else synode-cli asks for it)
            if [ -n "$CENTRAL_PSWD" ]; then
              jq --arg p "$CENTRAL_PSWD" '.centralPswd = $p' $WORK/$1/WEB-INF/settings.json > $WORK/s.json \
                && mv $WORK/s.json $WORK/$1/WEB-INF/settings.json
            fi
            python $CONFIG/feed_answers.py $CONFIG/answers/$1.txt --cwd $WORK/$1 --log $WORK/logs/$1-cli.log
            [ -x $WORK/$1/jre17/bin/java ] || { echo "::error::$1: setup did not finish, see $1-cli.log"; return 1; }

            (cd $WORK/$1 && nohup ./jre17/bin/java -jar bin/jserv-album-*.jar > $WORK/logs/$1-jserv.log 2>&1 &)
            timeout 120 bash -c "until nc -z 127.0.0.1 $2; do sleep 2; done" || {
              tail -80 $WORK/logs/$1-jserv.log; echo "::error::$1: jserv not listening on $2"; return 1; }
            echo "$1 is up on $2"
          }
          setup_node hub  8961
          setup_node prv1 8962
          setup_node prv2 8963

      # ---- 5. report ----
      - name: Report the central's domain tables
        if: always()
        run: |
          db=$(find $WORK/central -name system.sqlite | head -1)
          [ -n "$db" ] || { echo "no central system.sqlite found"; exit 0; }
          # a node reports its state shortly after its jserv starts: wait for none left in 'c' (create)
          for i in $(seq 30); do
            left=$(sqlite3 -readonly "$db" "select count(*) from c_synodes where domx = '$CENTRAL_DOMAIN' and stat = 'c';")
            [ "$left" = 0 ] && break; sleep 2
          done
          [ "$left" = 0 ] || echo "::warning::$left synode(s) of $CENTRAL_DOMAIN still in state c (create)"
          {
            # only the test org: the snapshot also holds other orgs, and this repository is public
            echo "### Central c_syndomx (domains of $CENTRAL_ORG)"
            sqlite3 -readonly -markdown "$db" "select * from c_syndomx where orgid = '$CENTRAL_ORG';"
            echo
            echo "### Central c_synodes ($CENTRAL_ORG)"
            sqlite3 -readonly -markdown "$db" "select market, orgid, domx, sid, mode, stat, jserv, optime from c_synodes where orgid = '$CENTRAL_ORG';"
          } | tee -a $GITHUB_STEP_SUMMARY $WORK/logs/central-tables.md

      - name: Collect logs
        if: always()
        run: |
          sudo journalctl -u regist-central --no-pager > $WORK/logs/central.log 2>&1 || true
          for n in hub prv1 prv2; do
            cp $WORK/$n/WEB-INF/settings.json $WORK/logs/$n-settings.json 2>/dev/null || true
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synode-e2e-linux
          path: |
            e2e/logs/
