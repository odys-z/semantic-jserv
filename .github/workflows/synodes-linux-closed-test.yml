# Linux end-to-end test of the closed-test packages, started by hand from the Actions tab.
#
# 1. Downloads the newest synode-*-x64_linux*.tar.gz from this repo's releases (or the tag given),
#    and the desktop-*.zip of the same release (its IPC agent jar and settings).
# 2. Extracts the synode package for 3 nodes: hub, prv1, prv2.
# 3. Starts the registry central of CENTRAL_RELEASE (.github/actions/start-central; private
#    release, read with the secret REGIST_CENTRAL_0_1_8_SNAPSHOT_TOKEN).
# 4. Configures each node with synode-cli, fed by jserv-album/actions-config/answers/<node>.txt, and starts its jserv.
# 5. Reports the central's domain tables in the run's Summary.
# 6. Builds the desktop's test client without Slint (odys-z/Anclient
#    examples/example.slint/github-tests, doclient_tests; .github/actions/build-github-tests),
#    pushes a file to the hub through the IPC agent (Ipclient.E2E_PushSync), and checks it in
#    h_photos of hub, prv1 and prv2.
#
# See jserv-album/actions-config/README.md for the central release to upload.

name: synodes-linux-closed-test

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to test (empty: the newest synode linux tar.gz in any release)'
        required: false
        default: ''
      central_repo:
        description: 'Repository of the central release'
        required: false
        default: 'Acadynamo/Resources-release'
      central_release:
        description: 'Release tag of the central (jar, WEB-INF, regist-vol)'
        required: false
        default: 'alpha-central-0.1.8'
      anclient_ref:
        description: 'Branch / tag of odys-z/Anclient for the test client'
        required: false
        default: 'portfolio-0.8'

permissions:
  contents: read

jobs:
  closed-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      CONFIG: ${{ github.workspace }}/jserv-album/actions-config
      WORK: ${{ github.workspace }}/e2e
      CENTRAL_URL: http://127.0.0.1:1991/regist-central
      CENTRAL_ORG: closed-test          # the org of the package; only its rows are reported
      CENTRAL_DOMAIN: closed-1          # the domain the answer files select
      CENTRAL_PSWD: '123456'            # admin of the test central (alpha-central-0.1.8), test only
      SYNC_INS: '20'
      HUB_JSERV: http://127.0.0.1:8961/jserv-album

    steps:
      - uses: actions/checkout@v7          # the test resources and the composite actions; no sources
        with:
          sparse-checkout: |
            jserv-album/actions-config
            .github/actions

      - uses: actions/checkout@v7          # the test client
        with:
          repository: odys-z/Anclient
          ref: ${{ inputs.anclient_ref }}
          path: Anclient

      - uses: actions/setup-java@v6          # for the central and the IPC agent; the synodes download their own jre17
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: OS packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libimage-exiftool-perl sqlite3
          # synode-cli imports PySide6 (jre_downloader.py), which loads Qt's graphics libraries
          # even without a display; the runner lacks some of them (libEGL.so.1, ...)
          sudo apt-get install -y -qq libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
          mkdir -p $WORK/dl $WORK/logs

      - name: Check the answer files
        run: |
          for f in $CONFIG/answers/{hub,prv1,prv2}.txt; do
            python $CONFIG/feed_answers.py $f --dry-run
          done

      # ---- 1. newest package ----
      - name: Download the synode package and the desktop
        run: |
          # every release, newest asset first; filtered by RELEASE_TAG when given
          pick=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" | jq -rs --arg t "$RELEASE_TAG" '
                   add | map(select($t == "" or .tag_name == $t) | .tag_name as $tag
                   | .assets[] | select(.name | test("^synode-.*x64_linux.*\\.tar\\.gz$"))
                   | [.updated_at, $tag, .name]) | sort | reverse | .[0] // empty | @tsv')
          [ -n "$pick" ] || { echo "::error::no synode linux tar.gz found in releases ${RELEASE_TAG:+(tag $RELEASE_TAG)}"; exit 1; }
          IFS=$'\t' read -r updated tag name <<< "$pick"
          gh release download "$tag" -R "$GITHUB_REPOSITORY" -p "$name" -D $WORK/dl
          echo "PACKAGE=$WORK/dl/$name" >> $GITHUB_ENV
          echo "### Package: \`$name\` (release \`$tag\`, uploaded $updated)" >> $GITHUB_STEP_SUMMARY

          # the desktop of the same release: its IPC agent jar and settings
          gh release download "$tag" -R "$GITHUB_REPOSITORY" -p 'desktop-*.zip' -D $WORK/dl/desktop || {
            echo "::error::no desktop-*.zip in release $tag"; exit 1; }
          mkdir -p $WORK/desktop && unzip -q -o $WORK/dl/desktop/desktop-*.zip 'res/ws-agent-*.jar' 'settings/app-settings.json' -d $WORK/desktop
          ls -l $WORK/desktop/res $WORK/desktop/settings
          echo "### Desktop: \`$(cd $WORK/dl/desktop && ls)\` ($(cd $WORK/desktop/res && ls))" >> $GITHUB_STEP_SUMMARY

      # ---- 2. three nodes ----
      - name: Extract hub, prv1, prv2
        run: |
          for n in hub prv1 prv2; do
            mkdir -p $WORK/$n && tar -xf "$PACKAGE" -C $WORK/$n    # the tar.gz has no top folder
          done
          pip install -q $WORK/hub/bin/synode_py3-*.whl
          synode-cli --help | head -1

      # ---- 3. central ----
      - name: Start the registry central
        id: central
        uses: ./.github/actions/start-central
        with:
          token: ${{ secrets.REGIST_CENTRAL_0_1_8_SNAPSHOT_TOKEN }}
          repo: ${{ inputs.central_repo }}
          release: ${{ inputs.central_release }}
          path: ${{ github.workspace }}/e2e/central

      # ---- 4. nodes, one by one: configure, then start the jserv ----
      - name: Configure and start the synodes
        shell: bash
        run: |
          setup_node() {   # <node> <jserv-port>
            # the test central's admin password, not the package's default (else synode-cli asks for it)
            if [ -n "$CENTRAL_PSWD" ]; then
              jq --arg p "$CENTRAL_PSWD" '.centralPswd = $p' $WORK/$1/WEB-INF/settings.json > $WORK/s.json \
                && mv $WORK/s.json $WORK/$1/WEB-INF/settings.json
            fi
            python $CONFIG/feed_answers.py $CONFIG/answers/$1.txt --cwd $WORK/$1 --log $WORK/logs/$1-cli.log
            [ -x $WORK/$1/jre17/bin/java ] || { echo "::error::$1: setup did not finish, see $1-cli.log"; return 1; }

            (cd $WORK/$1 && nohup ./jre17/bin/java -jar bin/jserv-album-*.jar > $WORK/logs/$1-jserv.log 2>&1 &)
            timeout 120 bash -c "until nc -z 127.0.0.1 $2; do sleep 2; done" || {
              tail -80 $WORK/logs/$1-jserv.log; echo "::error::$1: jserv not listening on $2"; return 1; }
            echo "$1 is up on $2"
          }
          setup_node hub  8961
          setup_node prv1 8962
          setup_node prv2 8963

      # ---- 5. report ----
      - name: Report the central's domain tables
        if: always()
        env:
          DB: ${{ steps.central.outputs.db }}
        run: |
          [ -n "$DB" ] || { echo "no central system.sqlite found"; exit 0; }
          # a node reports its state shortly after its jserv starts: wait for none left in 'c' (create)
          for i in $(seq 30); do
            left=$(sqlite3 -readonly "$DB" "select count(*) from c_synodes where domx = '$CENTRAL_DOMAIN' and stat = 'c';")
            [ "$left" = 0 ] && break; sleep 2
          done
          [ "$left" = 0 ] || echo "::warning::$left synode(s) of $CENTRAL_DOMAIN still in state c (create)"
          {
            # only the test org: the snapshot also holds other orgs, and this repository is public
            echo "### Central c_syndomx (domains of $CENTRAL_ORG)"
            sqlite3 -readonly -markdown "$DB" "select * from c_syndomx where orgid = '$CENTRAL_ORG';"
            echo
            echo "### Central c_synodes ($CENTRAL_ORG)"
            sqlite3 -readonly -markdown "$DB" "select market, orgid, domx, sid, mode, stat, jserv, optime from c_synodes where orgid = '$CENTRAL_ORG';"
          } | tee -a $GITHUB_STEP_SUMMARY $WORK/logs/central-tables.md

      # ---- 6. the test client pushes a file to the hub ----
      - name: Build the test client (doclient_tests)
        id: client
        uses: ./.github/actions/build-github-tests
        with:
          targets: doclient_tests

      - name: Push a file to the hub (doclient_tests)
        working-directory: ${{ steps.client.outputs.build-dir }}
        shell: bash        # -o pipefail: a failing test fails the step through tee
        run: |
          jar=$(ls $WORK/desktop/res/ws-agent-*.jar)
          # the released desktop settings, pointed at the hub of this test
          jq --arg java "$JAVA_HOME/bin/java" --arg jar "$jar" --arg jserv "$HUB_JSERV" \
             --arg vol "$WORK/hub/vol" \
             '.java_path = $java | .wsagent_jar = $jar | .synode_jserv = $jserv
              | .synode_id = "closed-1-hub" | .synode_vol = $vol | .device = "ci-desktop"' \
             $WORK/desktop/settings/app-settings.json > settings/ci-settings.json
          ALBUM_TEST_SETTINGS=settings/ci-settings.json \
          SYNODE_E2E_HOME_VOL=$WORK/hub/vol SYNODE_E2E_PEER_VOL=$WORK/prv1/vol SYNODE_E2E_TIMEOUT=240 \
            ./doclient_tests --gtest_filter='Ipclient.Echo:Ipclient.E2E_PushSync' 2>&1 | tee $WORK/logs/doclient_tests.log

      - name: Check the pushed file in h_photos
        run: |
          # the test pushes res/182x121.png as 182x121_e2e_<time>_<nonce>.png
          q="select pid, docname, device, filesize, shareflag from h_photos where docname like '182x121_e2e_%';"
          echo "### h_photos (the pushed file)" >> $GITHUB_STEP_SUMMARY
          for n in hub prv1 prv2; do
            db=$WORK/$n/vol/doc-jserv.db
            for i in $(seq 60); do          # peers synchronize every SYNC_INS seconds
              rows=$(sqlite3 -readonly "$db" "$q" 2>/dev/null | wc -l)
              [ "$rows" -gt 0 ] && break; sleep 5
            done
            { echo; echo "#### $n"; sqlite3 -readonly -markdown "$db" "$q"; } >> $GITHUB_STEP_SUMMARY
            [ "$rows" -gt 0 ] || { echo "::error::$n: the pushed file is not in h_photos"; failed=1; }
            echo "$n: $rows row(s)"
          done
          [ -z "$failed" ]

      - name: Collect logs
        if: always()
        env:
          CLIENT: ${{ steps.client.outputs.build-dir }}
        run: |
          sudo journalctl -u regist-central --no-pager > $WORK/logs/central.log 2>&1 || true
          for n in hub prv1 prv2; do
            cp $WORK/$n/WEB-INF/settings.json $WORK/logs/$n-settings.json 2>/dev/null || true
          done
          [ -z "$CLIENT" ] || cp $CLIENT/log/*.log $WORK/logs/ 2>/dev/null || true   # IPC agent

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: synodes-linux-closed-test
          path: |
            e2e/logs/
