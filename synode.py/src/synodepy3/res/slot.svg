    <rect x="151" y="60" width="10" height="32" rx="2"/>
    <rect x="166" y="60" width="10" height="32" rx="2"/>
  </g>

  <!-- Bottom Shielding Bar -->
  <rect x="56" y="204" width="144" height="14" rx="3" fill="#3A3A3A"/>
</svg>
